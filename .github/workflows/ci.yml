name: ci
on:
  push:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile
        run: |
          javac -Xlint:-options -d out $(find src/main/java -name '*.java') 2> /tmp/javac.err || {
            cat /tmp/javac.err
            msg=$(head -c 2500 /tmp/javac.err | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=javac failed::$msg"
            exit 1
          }
          cp -r src/main/resources/* out/
      - name: Launcher compile check (cross-platform)
        run: javac -d /tmp/launch-check Launch.java
      - name: Bootstrap JDK17-compat + run check
        run: |
          javac --release 17 -d out_boot17 src/main/java/dev/organism/tools/JdkBootstrap.java
          java -cp out_boot17 dev.organism.tools.JdkBootstrap /tmp/orgjdk
      - name: Net selftest (SWIM-lite membership)
        run: java -cp out dev.organism.net.NetSelfTest
      - name: Cell selftest (evolution + immune, deterministic)
        run: java -cp out dev.organism.cell.CellSelfTest
      - name: Storage selftest (replication, deterministic)
        run: java -cp out dev.organism.storage.StorageSelfTest
      - name: Organism selftest (simulation, data layer, symbiont)
        run: java -Dstdout.encoding=UTF-8 -cp out dev.organism.Main --selftest
      - name: Production selftest (security, immune, symbiont, migration, obs, api)
        run: |
          keytool -genkeypair -alias organism -keyalg RSA -keysize 2048 -storetype PKCS12 \
            -keystore /tmp/organism-test.p12 -storepass changeit -dname "CN=localhost" -ext SAN=dns:localhost,ip:127.0.0.1 -validity 2
          java -cp out dev.organism.selftest.ProductionSelfTest /tmp/organism-test.p12 changeit
      - name: UI + Genome selftest (parser, GUI, cluster/audit, rate-limit)
        run: java -cp out dev.organism.selftest.UiGenomeSelfTest
      - name: Launcher setup smoke (cross-platform keygen)
        run: java -cp out dev.organism.Launcher --setup-only
      - name: Chaos test (partition and recovery)
        run: |
          chmod +x bench/chaos.sh
          ./bench/chaos.sh

      - name: Pillar 1 selftest (supply chain CBOR/Ed25519)
        run: java -cp out dev.organism.supplychain.SupplyChainSelfTest
      - name: Pillar 2 selftest (Raft consensus)
        run: java -cp out dev.organism.raft.RaftSelfTest
      - name: Pillar 2/6 selftest (envelope, SPRT, WebAuthn, four-eyes)
        run: java -cp out dev.organism.control.ControlSelfTest
      - name: Pillar 4 selftest (fencing epochs)
        run: java -cp out dev.organism.data.DataPlaneSelfTest
      - name: Pillar 5 selftest (hierarchical gossip, WAN/churn)
        run: java -cp out dev.organism.net.hier.HierarchySelfTest
      - name: Pillar 5 selftest (JDK CA, 24h certs, CRL, mTLS)
        run: java -cp out dev.organism.security.ca.CaSelfTest
      - name: Pillar 6 selftest (Merkle, TSA, tamper)
        run: java -cp out dev.organism.audit.AuditTrustSelfTest
      - name: Pillar 3 selftest (native supervisor, drain, supply-chain gate)
        run: java -cp out dev.organism.exec.SupervisorSelfTest
      - name: Control plane end-to-end selftest (HTTP)
        run: java -cp out dev.organism.selftest.ControlPlaneSelfTest
      - name: Uplink selftest (kernel gate <-> control plane, 6.1)
        run: java -cp out dev.organism.control.UplinkSelfTest
