name: ci
on:
  push:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile
        run: |
          javac -Xlint:-options -d out $(find src/main/java -name '*.java') 2> /tmp/javac.err || {
            cat /tmp/javac.err
            msg=$(head -c 2500 /tmp/javac.err | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=javac failed::$msg"
            exit 1
          }
          cp -r src/main/resources/* out/
      - name: Launcher compile check (cross-platform)
        run: javac -d /tmp/launch-check Launch.java
      - name: Bootstrap JDK17-compat + run check
        run: |
          javac --release 17 -d out_boot17 src/main/java/dev/organism/tools/JdkBootstrap.java
          java -cp out_boot17 dev.organism.tools.JdkBootstrap /tmp/orgjdk
      - name: Net selftest (SWIM-lite membership)
        run: java -cp out dev.organism.net.NetSelfTest
      - name: Cell selftest (evolution + immune, deterministic)
        run: java -cp out dev.organism.cell.CellSelfTest
      - name: Storage selftest (replication, deterministic)
        run: java -cp out dev.organism.storage.StorageSelfTest
      - name: Organism selftest (simulation, data layer, symbiont)
        run: java -Dstdout.encoding=UTF-8 -cp out dev.organism.Main --selftest
      - name: Production selftest (security, immune, symbiont, migration, obs, api)
        run: |
          keytool -genkeypair -alias organism -keyalg RSA -keysize 2048 -storetype PKCS12 \
            -keystore /tmp/organism-test.p12 -storepass changeit -dname "CN=localhost" -ext SAN=dns:localhost,ip:127.0.0.1 -validity 2
          java -cp out dev.organism.selftest.ProductionSelfTest /tmp/organism-test.p12 changeit
      - name: UI + Genome selftest (parser, GUI, cluster/audit, rate-limit)
        run: java -cp out dev.organism.selftest.UiGenomeSelfTest
      - name: Launcher setup smoke (cross-platform keygen)
        run: java -cp out dev.organism.Launcher --setup-only
      - name: Chaos test (partition and recovery)
        run: |
          chmod +x bench/chaos.sh
          ./bench/chaos.sh

      - name: Pillar 1 selftest (supply chain CBOR/Ed25519)
        run: java -cp out dev.organism.supplychain.SupplyChainSelfTest
      - name: Pillar 2 selftest (Raft consensus)
        run: java -cp out dev.organism.raft.RaftSelfTest
      - name: Pillar 2/6 selftest (envelope, SPRT, WebAuthn, four-eyes)
        run: java -cp out dev.organism.control.ControlSelfTest
      - name: Pillar 4 selftest (fencing epochs)
        run: java -cp out dev.organism.data.DataPlaneSelfTest
      - name: Pillar 5 selftest (hierarchical gossip, WAN/churn)
        run: java -cp out dev.organism.net.hier.HierarchySelfTest
      - name: Pillar 5 selftest (JDK CA, 24h certs, CRL, mTLS)
        run: java -cp out dev.organism.security.ca.CaSelfTest
      - name: Pillar 6 selftest (Merkle, TSA, tamper)
        run: java -cp out dev.organism.audit.AuditTrustSelfTest
      - name: Pillar 3 selftest (native supervisor, drain, supply-chain gate)
        run: java -cp out dev.organism.exec.SupervisorSelfTest
      - name: Control plane end-to-end selftest (HTTP)
        run: java -cp out dev.organism.selftest.ControlPlaneSelfTest
      - name: Uplink selftest (kernel gate <-> control plane, 6.1)
        run: java -cp out dev.organism.control.UplinkSelfTest
      - name: Rollout selftest (6.2 impact, canary split, SPRT, four-eyes, drain)
        run: java -cp out dev.organism.rollout.RolloutSelfTest
      - name: Scale selftest (5000 nodes, hierarchical gossip WAN/churn)
        run: java -cp out dev.organism.net.hier.ScaleSelfTest

      - name: Pillar 1/6 selftest (signed genome artifact + FIDO2 node API)
        run: java -cp out dev.organism.selftest.WebAuthnApiSelfTest
      - name: Six views selftest (6.4 GUI/API rollout/control/anchor)
        run: java -cp out dev.organism.selftest.SixViewsSelfTest
      - name: SignCount persistence selftest (6.6 clone-detect across restart)
        run: java -cp out dev.organism.selftest.SignCountPersistSelfTest

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Force JDK 17 on PATH (prove the auto-bootstrap path)
        shell: pwsh
        run: |
          $j17 = $env:JAVA_HOME_17_X64
          if (-not $j17) { throw "JAVA_HOME_17_X64 not set on runner" }
          "JAVA_HOME=$j17" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PATH=$j17\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "$j17\bin\java.exe" -version
      - id: bat
        name: organism.bat (JDK17 -> auto-bootstrap JDK25 -> compile -> setup smoke)
        shell: cmd
        run: organism.bat --setup-only > win.log 2>&1
      - name: Windows launcher diagnostics
        if: always()
        shell: pwsh
        run: |
          $log = if (Test-Path win.log) { Get-Content -Raw win.log } else { "win.log missing" }
          Write-Host $log
          $head = $log.Substring(0, [Math]::Min(1800, $log.Length))
          $n = $head -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
          Write-Host "::notice title=organism.bat log (head)::$n"
          if ("${{ steps.bat.outcome }}" -ne "success") {
            $tail = $log.Substring([Math]::Max(0, $log.Length - 2400))
            $enc = $tail -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Host "::error title=organism.bat failed::$enc"
          }
      - name: Cluster + GUI smoke on Windows (2 nodes, bounded 120s)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c","organism.bat 2 > cluster.log 2>&1" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri "https://127.0.0.1:9101/health" -SkipCertificateCheck -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          $diag = ""
          if (Test-Path cluster.log) { $diag += (Get-Content -Raw cluster.log) }
          Get-ChildItem .organism/node-*.log -ErrorAction SilentlyContinue | ForEach-Object {
            $diag += "=== " + $_.Name + " ===" + [char]10 + ((Get-Content $_ -Tail 20) -join [char]10) + [char]10
          }
          Write-Host $diag
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $tail = $diag.Substring(0, [Math]::Min(1800, $diag.Length))
          $enc = $tail -replace "%","%25" -replace ([char]13),"%0D" -replace ([char]10),"%0A"
          Write-Host "::notice title=windows cluster log::$enc"
          if (-not $ok) { Write-Host "::error title=windows GUI smoke::/health did not return 200 within 120s"; exit 1 }
          Write-Host "Windows GUI smoke OK"
