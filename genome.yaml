# ORGANISM Genome Configuration
# Декларативное описание целей, ограничений и способностей системы.

objectives:
  - latency_p99_ms: 50.0
  - cost_usd_per_month: 300.0
  - throughput_rps: 10000.0

constraints:
  - allowed_regions: eu-west-1,eu-central-1
  - max_memory_mb_per_agent: 512
  - forbidden_apis: legacy-v1,deprecated-auth

capabilities:
  - processing: 2,16
  - storage: 24,3
  - balancing: least-connections
  - immune: true

mutation_policy:
  pool_size: 2,16,2
  queue_limit: 64,2048,64
  cache_mb: 32,512,32
  timeout_ms: 100,2000,100
